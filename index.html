<style>
/* Layout: app shell. Fixed sidebar on desktop, bottom tab bar on phones; quiet surfaces, one petrol accent, numbers in mono. */
:root{

}

  --pos:#55C48D; --pos-soft:#11291D; --neg:#F07A70; --neg-soft:#331816; --warn:#E3A84E; --warn-soft:#2E2312;
  --shadow:none; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0D1115; --surface:#151B21; --surface2:#1A2128; --ink:#E6EBEF; --muted:#9AA5B1; --faint:#6E7A86;
  --line:#253039; --accent:#41B6AC; --accent-ink:#04201D; --accent-soft:#12302D;
  --pos:#55C48D; --pos-soft:#11291D; --neg:#F07A70; --neg-soft:#331816; --warn:#E3A84E; --warn-soft:#2E2312;
  --shadow:none; color-scheme:dark;}
*{box-sizing:border-box}
html,body{height:100%}

.muted{color:var(--muted)} .faint{color:var(--faint)} .pos{color:var(--pos)} .neg{color:var(--neg)}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:var(--side) 1fr;min-height:100%}

.rows{display:flex;flex-direction:column}

.bar{height:6px;border-radius:99px;background:var(--surface2);overflow:hidden;border:1px solid var(--line)}

.search{position:relative;flex:1 1 220px;min-width:0}

.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;font-family:var(--f-num);font-variant-numeric:tabular-nums}
.tbl th:first-child,.tbl td:first-child{text-align:left;font-family:var(--f-ui)}

.tbl td.z{color:var(--faint)}
.chartbox{width:100%;min-width:0}.chart{display:block;max-width:100%}

.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.welcome{display:flex;gap:18px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);border-radius:var(--r);padding:18px 20px}

.field{display:flex;flex-direction:column;gap:5px;min-width:0}

  .bottom .rail-brand{width:36px;height:36px;border-radius:10px;background:var(--surface2);color:var(--muted);border:1px solid var(--line);display:grid;place-items:center;margin-bottom:10px;padding:0}

  .hide-m{display:none}
}

let D=null;
function derive(){
  const d=S.data;const m=(arr)=>Object.fromEntries(arr.map(x=>[x.id,x]));
  const cat=m(d.categories),acc=m(d.accounts),card=m(d.cards),wal=m(d.wallets),cred=m(d.creditors);
  const inst=[];for(const p of d.cardTx){for(const x of installments(p,card[p.card]))inst.push(x)}
  D={cat,acc,card,wal,cred,inst};return D;
}
function firstFatura(card,date){const[y,m,dd]=date.split("-").map(Number);let add=0;if(card&&card.close){if(dd>=card.close)add++;if(card.due&&card.due<=card.close)add++}return addMonths(mkey(y,m),add)}
function installments(p,card){const f=firstFatura(card,p.date);const n=Math.max(1,p.n|0);const base=Math.floor(p.total/n),rest=p.total-base*n;return Array.from({length:n},(_,i)=>({key:addMonths(f,i),amount:base+(i===0?rest:0),i:i+1,n,p}))}
function per(){if(S.period.mode==="custom"&&S.period.from&&S.period.to)return{from:S.period.from,to:S.period.to};const{y,m}=S.period;return{from:mkey(y,m)+"-01",to:mkey(y,m)+"-"+pad(lastDay(y,m))}}
const kindOf=t=>(D.cat[t.cat]||{}).kind||"despesa";
function summary(from,to){
  const kf=from.slice(0,7),kt=to.slice(0,7);
  const r={rec:0,despC:0,despK:0,apl:0,resg:0,pendOut:0,pendIn:0,byCat:{},recByCat:{},byGroup:{}};
  for(const t of S.data.tx){if(t.date<from||t.date>to)continue;
    if(t.status==="pendente"){if(t.type==="in")r.pendIn+=t.amount;else r.pendOut+=t.amount;continue}
    const k=kindOf(t);
    if(k==="receita"&&t.type==="in"){r.rec+=t.amount;r.recByCat[t.cat]=(r.recByCat[t.cat]||0)+t.amount}
    else if(k==="despesa"&&t.type==="out"){r.despC+=t.amount;r.byCat[t.cat]=(r.byCat[t.cat]||0)+t.amount}
    else if(k==="aplicacao")r.apl+=t.type==="out"?t.amount:-t.amount;
    else if(k==="resgate")r.resg+=t.type==="in"?t.amount:-t.amount;
  }
  for(const x of D.inst){if(x.key<kf||x.key>kt)continue;r.despK+=x.amount;r.byCat[x.p.cat]=(r.byCat[x.p.cat]||0)+x.amount}
  for(const[c,v]of Object.entries(r.byCat)){const g=(D.cat[c]&&D.cat[c].group)||"Outros";r.byGroup[g]=(r.byGroup[g]||0)+v}
  r.desp=r.despC+r.despK;r.res=r.rec-r.desp;r.rate=r.rec>0?r.res/r.rec:NaN;return r;
}
function accBal(id,upto){const a=D.acc[id];let b=a?a.initial||0:0;for(const t of S.data.tx){if(t.account!==id||t.status==="pendente"||(upto&&t.date>upto))continue;b+=t.type==="in"?t.amount:-t.amount}return b}

  const base=ini+(ap-rs)/2;return{ini,ap,rs,rd,fim:ini+ap-rs+rd,ret:base>0&&(rd||ini||ap)?rd/base:NaN}}
function walBal(id,upto){let b=0;for(const v of S.data.inv){if((id&&v.wallet!==id)||(upto&&v.date>upto))continue;b+=v.kind==="resgate"?-v.amount:v.amount}return b}

function cardInfo(c){
  const charged=D.inst.filter(x=>x.p.card===c.id).reduce((s,x)=>s+x.amount,0);
  const paid=S.data.tx.filter(t=>t.card===c.id&&t.status!=="pendente").reduce((s,t)=>s+t.amount,0);
  const used=Math.max(0,charged-paid);return{used,avail:(c.limit||0)-used};
}

function niceStep(v){const p=Math.pow(10,Math.floor(Math.log10(Math.max(v,1))));const f=v/p;return(f<=1?1:f<=2?2:f<=5?5:10)*p}
function short(c){const v=c/100;if(v>=1e6)return(v/1e6).toLocaleString("pt-BR",{maximumFractionDigits:1})+" mi";if(v>=1e3)return(v/1e3).toLocaleString("pt-BR",{maximumFractionDigits:1})+" mil";return v.toLocaleString("pt-BR",{maximumFractionDigits:0})}
function monthsBack(endKey,n){return Array.from({length:n},(_,i)=>addMonths(endKey,i-n+1))}
function monthSummary(k){const[y,m]=k.split("-").map(Number);return summary(k+"-01",k+"-"+pad(lastDay(y,m)))}

VIEWS.tx=()=>{
  const p=per(),F=S.filters,q=norm(F.q);
  let items=S.data.tx.filter(t=>t.date>=p.from&&t.date<=p.to).map(t=>({k:"tx",t,date:t.date}));
  items=items.concat(S.data.cardTx.filter(c=>c.date>=p.from&&c.date<=p.to).map(c=>({k:"card",t:c,date:c.date})));
  items=items.filter(({k,t})=>{
    if(F.type==="in"&&!(k==="tx"&&t.type==="in"))return false;
    if(F.type==="out"&&!(k==="card"||t.type==="out"))return false;
    if(F.cat&&t.cat!==F.cat)return false;
    if(F.acc&&(k==="card"?"card:"+t.card:t.account)!==F.acc)return false;
    if(F.status&&(k==="card"?"pago":t.status||"pago")!==F.status)return false;
    if(q&&!norm([t.desc,t.note,catName(t.cat)].join(" ")).includes(q))return false;return true});
  items.sort((a,b)=>b.date.localeCompare(a.date)||(b.t.ts||0)-(a.t.ts||0));
  let tin=0,tout=0;items.forEach(({k,t})=>{if(k==="card")tout+=t.total;else if(t.type==="in")tin+=t.amount;else tout+=t.amount});
  const groups={};items.forEach(x=>{(groups[x.date]=groups[x.date]||[]).push(x)});
  const catOpts=S.data.categories.filter(c=>!c.system).sort((a,b)=>a.name.localeCompare(b.name)).map(c=>`<option value="${c.id}" ${F.cat===c.id?"selected":""}>${esc(c.name)}</option>`).join("");
  const accOpts=S.data.accounts.map(a=>`<option value="${a.id}" ${F.acc===a.id?"selected":""}>${esc(a.name)}</option>`).join("")+S.data.cards.map(c=>`<option value="card:${c.id}" ${F.acc==="card:"+c.id?"selected":""}>Cartão ${esc(c.name)}</option>`).join("");
  return`${headerHTML("Lançamentos",periodText(),`<button class="btn" data-act="exportCsv">${ic("down")}<span class="hide-m">Exportar CSV</span></button><button class="btn pri" data-act="newTx">${ic("plus")}Novo</button>`)}
  <section class="panel"><div class="panel-b" style="display:flex;flex-direction:column;gap:12px">
    <div class="toolbar"><label class="search">${ic("search")}<input class="inp" id="fq" placeholder="Buscar descrição, categoria ou observação" value="${esc(F.q)}"></label>
      <div class="seg" role="group" aria-label="Tipo">${[["all","Todos"],["in","Entradas"],["out","Saídas"]].map(([v,l])=>`<button data-act="ftype" data-v="${v}" aria-pressed="${F.type===v}">${l}</button>`).join("")}</div></div>
    <div class="toolbar"><select class="sel" id="fcat" aria-label="Categoria"><option value="">Todas as categorias</option>${catOpts}</select>
      <select class="sel" id="facc" aria-label="Conta"><option value="">Todas as contas</option>${accOpts}</select>
      <select class="sel" id="fst" aria-label="Status"><option value="">Qualquer status</option><option value="pago" ${F.status==="pago"?"selected":""}>Pago</option><option value="pendente" ${F.status==="pendente"?"selected":""}>Pendente</option></select>
      ${F.q||F.type!=="all"||F.cat||F.acc||F.status?`<button class="btn ghost sm" data-act="fclear">Limpar filtros</button>`:""}</div>
    <div class="toolbar small" style="gap:18px"><span>${items.length} lançamento${items.length===1?"":"s"}</span><span>Entradas <b class="num pos">${money(tin)}</b></span><span>Saídas <b class="num neg">${money(tout)}</b></span><span>Saldo <b class="num">${signed(tin-tout)}</b></span></div>
  </div></section>
  <section class="panel"><div class="panel-b" style="padding-top:0">
   ${items.length?Object.entries(groups).map(([d,arr])=>{const net=arr.reduce((s,{k,t})=>s+(k==="card"?-t.total:t.type==="in"?t.amount:-t.amount),0);return`<div class="day-h"><span>${dayLabel(d)}</span><span class="num">${signed(net)}</span></div><div class="rows">${arr.map(rowHTML).join("")}</div>`}).join(""):`<div class="empty"><h2>Nenhum lançamento</h2>Não há lançamentos neste período${F.q||F.cat||F.acc||F.status||F.type!=="all"?" com esses filtros":""}.</div>`}
  </div></section>`;
};
function rowHTML({k,t}){
  if(k==="card"){const c=D.card[t.card];return`<div class="row click" data-act="editCard" data-id="${t.id}"><div class="avatar out">${ic("card")}</div><div class="grow"><div class="t">${esc(t.desc||catName(t.cat))}</div><div class="m">${esc(catName(t.cat))} · Cartão ${esc(c?c.name:"?")}${t.n>1?" · "+t.n+"x de "+money(Math.round(t.total/t.n)):""}</div></div><div class="amt">− ${money(t.total)}</div></div>`}

}

function genRecurring(){const d=S.data;if(!d||!d.recur||!d.recur.length)return false;const cur=todayISO().slice(0,7);let ch=false;
  for(const r of d.recur){if(r.active===false)continue;let k=r.next||r.start||cur,g=0;
    while(k<=cur&&g++<36){if((!r.end||k<=r.end)&&!d.tx.some(t=>t.rec===r.id&&t.rkey===k)){const[y,m]=k.split("-").map(Number);
        d.tx.push({id:newId(),type:r.type||"out",date:k+"-"+pad(Math.min(r.day||1,lastDay(y,m))),amount:r.amount||0,cat:r.cat,account:r.account,desc:r.desc,method:r.method||"",status:"pendente",note:"",rec:r.id,rkey:k,ts:Date.now()});ch=true}
      k=addMonths(k,1)}
    if(r.next!==k){r.next=k;ch=true}}
  return ch}

function delTx(t){const ids=new Set([t.id]);if(t.pair)ids.add(t.pair);S.data.tx=S.data.tx.filter(x=>!ids.has(x.id));S.data.inv=S.data.inv.filter(v=>!ids.has(v.link));S.data.debts=S.data.debts.filter(v=>!ids.has(v.link))}
function saveTx(f,t,type,pair){
  const v=n=>f.elements[n]?f.elements[n].value:"";const amount=parseMoney(v("amount"));
  if(!(amount>0))return"Informe um valor maior que zero.";const date=v("date");if(!date)return"Informe a data.";
  if(t&&t.card){t.amount=amount;t.date=date;t.note=v("note").trim();commit();toast("Pagamento atualizado");return}
  if(type==="tr"){const from=v("from"),to=v("to");if(!to||from===to)return"Escolha contas de origem e destino diferentes.";
    const cat=S.data.categories.find(c=>c.kind==="transferencia").id;const note=v("note").trim();
    if(t){const out=t.type==="out"?t:pair,inn=t.type==="in"?t:pair;Object.assign(out,{amount,date,account:from,note});if(inn)Object.assign(inn,{amount,date,account:to,note})}

    commit();toast("Transferência salva");return}

  if(!pay)return"Cadastre uma conta em Ajustes primeiro.";
  const rec=t||{id:newId(),ts:Date.now()};Object.assign(rec,{type,date,amount,cat,account:pay,desc:v("desc").trim(),method:v("method"),status:v("status")||"pago",note:v("note").trim()});
  if(!t)S.data.tx.push(rec);

  if(t&&rec.rec&&rec.status==="pago"){const rr=S.data.recur.find(x=>x.id===rec.rec);if(rr)rr.amount=amount}
  const k=(D.cat[cat]||{}).kind;const wal=f.elements.wallet&&!f.elements.wallet.closest("[hidden]")?v("wallet"):"";
  S.data.inv=S.data.inv.filter(x=>x.link!==rec.id);
  if(wal&&(k==="aplicacao"||k==="resgate"))S.data.inv.push({id:newId(),link:rec.id,date,wallet:wal,kind:k==="aplicacao"?(type==="out"?"aporte":"resgate"):"resgate",amount,note:rec.desc});

  commit();toast(t?"Lançamento atualizado":rec.rec?"Conta fixa criada: vai aparecer todo mês":"Lançamento salvo");

function pickFile(accept){return new Promise(res=>{const i=document.createElement("input");i.type="file";i.accept=accept;i.onchange=()=>res(i.files[0]||null);i.click()})}
async function loadXLSX(){if(window.XLSX)return;await new Promise((res,rej)=>{const s=document.createElement("script");s.src="https:\/\/cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";s.onload=res;s.onerror=()=>rej(new Error("Não foi possível carregar o leitor de planilhas. Verifique a conexão."));document.head.appendChild(s)})}
function findTable(rows,req){for(let i=0;i<Math.min(rows.length,40);i++){const h=(rows[i]||[]).map(norm);if(req.every(r=>h.some(x=>x===r||x.startsWith(r))))return{h,body:rows.slice(i+1)}}return null}
const col=(h,...names)=>{for(const n of names){const i=h.findIndex(x=>x===n);if(i>=0)return i}for(const n of names){const i=h.findIndex(x=>x.startsWith(n));if(i>=0)return i}return-1};
function cellDate(v){if(v==null||v==="")return null;if(typeof v==="number"){const d=XLSX.SSF.parse_date_code(v);if(!d||!d.y)return null;return mkey(d.y,d.m)+"-"+pad(d.d)}if(v instanceof Date)return v.toISOString().slice(0,10);const m=String(v).match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);if(m)return m[3]+"-"+pad(m[2])+"-"+pad(m[1]);const m2=String(v).match(/^(\d{4})-(\d{2})-(\d{2})/);return m2?m2[0]:null}
function cellMoney(v){if(v==null||v==="")return 0;if(typeof v==="number")return Math.round(v*100);const c=parseMoney(v);return isNaN(c)?0:c}
const tc=s=>String(s||"").trim();
async function importSheet(){
  const file=await pickFile(".xlsx,.xlsm,.xls");if(!file)return;
  toast("Lendo planilha…");
  try{await loadXLSX();const wb=XLSX.read(await file.arrayBuffer(),{type:"array",cellDates:false});
    const sheet=pred=>{const n=wb.SheetNames.find(x=>pred(norm(x)));return n?XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:null}):null};
    const out={tx:[],inv:[],debts:[],accounts:new Map(),cats:new Map(),wallets:new Map(),creds:new Map()};
    const L=sheet(n=>n.includes("LANCAMENTO"));const lt=L&&findTable(L,["DATA","DESCRI"]);
    if(lt){const h=lt.h,c={d:col(h,"DATA"),desc:col(h,"DESCRICAO","DESCRI"),cat:col(h,"CATEGORIA"),ent:col(h,"ENTRADA"),sai:col(h,"SAIDA"),forma:col(h,"FORMA DE PAGAMENTO","FORMA PGTO","FORMA"),parc:col(h,"PARCELA"),bco:col(h,"BANCO","CONTA"),obs:col(h,"OBSERVACAO","OBS"),st:col(h,"STATUS")};
      for(const r of lt.body){const date=cellDate(r[c.d]);if(!date)continue;const e=cellMoney(r[c.ent]),s=cellMoney(r[c.sai]);if(!e&&!s)continue;
        const cat=tc(r[c.cat])||"SEM CATEGORIA";const bco=tc(r[c.bco])||"CONTA PRINCIPAL";
        if(!out.cats.has(norm(cat)))out.cats.set(norm(cat),{name:cat,ins:0,outs:0});const cc=out.cats.get(norm(cat));if(e)cc.ins++;else cc.outs++;
        out.accounts.set(norm(bco),bco);
        const pushTx=(type,amount)=>out.tx.push({type,date,amount,catN:norm(cat),accN:norm(bco),desc:tc(r[c.desc]),method:c.forma>=0?tc(r[c.forma]):"",inst:c.parc>=0?tc(r[c.parc]):"",note:c.obs>=0&&r[c.obs]!=null?tc(r[c.obs]):"",status:c.st>=0&&norm(r[c.st])==="PENDENTE"?"pendente":"pago"});
        if(e)pushTx("in",e);if(s)pushTx("out",s)}}
    const I=sheet(n=>n.includes("INVESTIMENTO"));const it=I&&findTable(I,["DATA","ENTRADA"]);
    if(it){const h=it.h,c={d:col(h,"DATA"),cat:col(h,"MOVIMENTO","CATEGORIA"),ent:col(h,"ENTRADA"),sai:col(h,"SAIDA"),w:col(h,"CARTEIRA","BANCO"),desc:col(h,"DESCRICAO","DESCRI"),obs:col(h,"OBSERVACAO")};
      for(const r of it.body){const date=cellDate(r[c.d]);if(!date)continue;const e=cellMoney(r[c.ent]),s=cellMoney(r[c.sai]);if(!e&&!s)continue;const cat=norm(r[c.cat]);const w=tc(r[c.w])||"INVESTIMENTOS";out.wallets.set(norm(w),w);
        const kind=s?"resgate":/RENDIMENTO/.test(cat)?"rendimento":/RETIRADA|SAQUE|RESGATE/.test(cat)?"resgate":"aporte";
        out.inv.push({date,kind,amount:e||s,walN:norm(w),note:c.obs>=0&&r[c.obs]?tc(r[c.obs]):""})}}
    const F=sheet(n=>n.includes("FINANCIAMENTO")||n.includes("DIVIDA"));const ft=F&&findTable(F,["DATA","PAGO"]);
    if(ft){const h=ft.h,c={d:col(h,"DATA"),cr:col(h,"CREDOR","FONTE"),rec:col(h,"RECEBIDO"),pag:col(h,"PAGO"),obs:col(h,"OBSERVACAO")};
      for(const r of ft.body){const date=cellDate(r[c.d]);if(!date)continue;const a=cellMoney(r[c.rec]),p=cellMoney(r[c.pag]);if(!a&&!p)continue;const cr=tc(r[c.cr])||"CREDOR";out.creds.set(norm(cr),cr);
        if(a)out.debts.push({date,kind:"contratado",amount:a,credN:norm(cr),note:c.obs>=0&&r[c.obs]?tc(r[c.obs]):""});if(p)out.debts.push({date,kind:"pagamento",amount:p,credN:norm(cr),note:""})}}
    if(!out.tx.length&&!out.inv.length&&!out.debts.length){toast("Não encontrei lançamentos nessa planilha.");return}
    const has=S.data.tx.length+S.data.inv.length+S.data.debts.length+S.data.cardTx.length;
    openModal({title:"Importar planilha",body:`<p style="margin:0">Encontrei <b>${out.tx.length}</b> lançamentos, <b>${out.inv.length}</b> movimentos de investimento e <b>${out.debts.length}</b> de dívidas em “${esc(file.name)}”.</p>
      <p class="muted small" style="margin:0">Contas: ${[...out.accounts.values()].map(esc).join(", ")||"—"}. Categorias: ${out.cats.size}. O arquivo foi lido aqui no seu aparelho e não foi enviado para lugar nenhum.</p>
      ${has?field("O que fazer com os dados atuais",`<select class="sel" name="mode"><option value="replace">Substituir tudo pelos dados da planilha</option><option value="merge">Somar aos dados atuais</option></select>`):""}`,submit:"Importar",
      onSubmit:f=>{applyImport(out,f.elements.mode?f.elements.mode.value:"replace")}});
  }catch(e){toast(e.message||"Não foi possível ler a planilha.")}
}
const IMPORT_KIND={"RENDA PRINCIPAL":"receita","RENDA EXTRA":"receita","OUTRAS RECEITAS":"receita","SALARIO":"receita","RENDIMENTOS":"receita","TRANSFERENCIA ENTRE CONTAS":"transferencia","INVESTIMENTOS":"aplicacao","APLICACAO":"aplicacao","BAIXA DE APLICACAO":"resgate","RESGATE DE APLICACAO":"resgate"};
const IMPORT_GROUP={"MORADIA":"Essencial fixa","FINANCIAMENTO":"Essencial fixa","EDUCACAO":"Essencial fixa","MERCADO":"Essencial variável","VEICULO":"Essencial variável","PET":"Essencial variável","FARMACIA":"Essencial variável","SAUDE":"Essencial variável","DARF":"Essencial variável","TAXAS":"Essencial variável","TARIFA BANCARIA":"Essencial variável","TRANSPORTE":"Não essencial","ALIMENTACAO":"Não essencial","ENTRETERIMENTO":"Não essencial","CONSUMO":"Não essencial","CUIDADO":"Não essencial","DESPESAS DIRETAS":"Imprevistos","IMPREVISTOS":"Imprevistos","EMPRESTIMO":"Dívidas","FATURA DO CARTAO":"Outros","SAQUE":"Outros"};
function applyImport(out,mode){
  const d=mode==="merge"?S.data:ensureSystem({...defaultData(),settings:S.data.settings,accounts:[],categories:[],cards:S.data.cards,goals:S.data.goals});
  const byName=(arr,name,make)=>{let x=arr.find(y=>norm(y.name)===norm(name));if(!x){x=make();arr.push(x)}return x};
  const accId={},catId={},walId={},credId={};
  for(const[k,n]of out.accounts)accId[k]=byName(d.accounts,n,()=>({id:newId(),name:n,type:"Corrente",initial:0})).id;
  for(const[k,c]of out.cats){const kind=IMPORT_KIND[k]||(c.ins>c.outs*2&&c.outs===0?"receita":"despesa");
    const ex=k==="TRANSFERENCIA ENTRE CONTAS"?d.categories.find(x=>x.kind==="transferencia"):null;
    catId[k]=(ex||byName(d.categories,c.name,()=>({id:newId(),name:c.name,kind,group:kind==="despesa"?(IMPORT_GROUP[k]||"Outros"):"",budget:0}))).id}
  for(const[k,n]of out.wallets)walId[k]=byName(d.wallets,n,()=>({id:newId(),name:n,type:""})).id;
  for(const[k,n]of out.creds)credId[k]=byName(d.creditors,n,()=>({id:newId(),name:n,type:/CAIXA|BANCO|FINANC/.test(k)?"Financiamento":"Empréstimo"})).id;
  let ts=Date.now()-out.tx.length;
  for(const t of out.tx)d.tx.push({id:newId(),type:t.type,date:t.date,amount:t.amount,cat:catId[t.catN],account:accId[t.accN],desc:t.desc,method:t.method,inst:t.inst,note:t.note,status:t.status,ts:ts++});
  for(const v of out.inv)d.inv.push({id:newId(),date:v.date,kind:v.kind,amount:v.amount,wallet:walId[v.walN],note:v.note});
  for(const x of out.debts)d.debts.push({id:newId(),date:x.date,kind:x.kind,amount:x.amount,creditor:credId[x.credN],note:x.note});
  if(!d.accounts.length)d.accounts.push({id:newId(),name:"Conta principal",type:"Corrente",initial:0});
  S.data=d;const last=d.tx.map(t=>t.date).sort().pop();if(last){S.period={mode:"month",y:+last.slice(0,4),m:+last.slice(5,7)};S.repYear=S.period.y}
  S.view="home";markDirty();render();toast("Importação concluída");
}
async function getDownloads(){try{return await window.claude?.use?.("downloads")}catch{return null}}
async function saveFile(filename,data,mime){
  if(S.gas){try{await gasRun("saveExport",filename,data,mime);toast("Salvo no seu Google Drive, pasta Caixa Forte › Exportações");return true}catch(e){toast(e.message);return false}}
  if(!S.local&&!S.drv){const dl=await getDownloads();if(!dl){toast("Exportação indisponível nesta visualização.");return false}try{const r=await dl.save({filename,data});return r&&(r.status==="saved"||r.status==="delivered")}catch{return false}}
  try{const url=URL.createObjectURL(new Blob([data],{type:mime}));const a=document.createElement("a");a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);return true}catch{toast("Não foi possível gerar o arquivo.");return false}}
async function exportCsv(){
  const q=s=>'"'+String(s??"").replace(/"/g,'""')+'"';const num=c=>(c/100).toFixed(2).replace(".",",");
  const lines=[["Data","Tipo","Descrição","Categoria","Natureza","Conta/Cartão","Forma","Entrada","Saída","Status","Observação"].join(";")];
  [...S.data.tx].sort((a,b)=>a.date.localeCompare(b.date)).forEach(t=>lines.push([fmtDate(t.date),t.type==="in"?"Entrada":"Saída",q(t.desc),q(catName(t.cat)),KINDS[kindOf(t)]||"",q(accName(t.account)),q(t.method),t.type==="in"?num(t.amount):"",t.type==="out"?num(t.amount):"",t.status||"pago",q(t.note)].join(";")));
  S.data.cardTx.forEach(p=>lines.push([fmtDate(p.date),"Cartão",q(p.desc+(p.n>1?" ("+p.n+"x)":"")),q(catName(p.cat)),"Despesa",q("Cartão "+((D.card[p.card]||{}).name||"")),"Crédito","",num(p.total),"pago",q(p.note)].join(";")));
  await saveFile("caixa-forte-lancamentos-"+todayISO()+".csv","\ufeff"+lines.join("\r\n"),"text/csv;charset=utf-8");
}
async function exportBackup(){
  await saveNow();const sealed=await seal(S.data,S.key);
  const file={format:"caixa-forte-backup",v:2,wraps:S.wraps,...sealed,exportedAt:new Date().toISOString()};
  if(await saveFile("caixa-forte-backup-"+todayISO()+".json",JSON.stringify(file),"application/json")){S.data.settings.lastBackup=todayISO();markDirty();rerender();if(!S.gas)toast("Backup exportado. Guarde em dois lugares.")}
}
async function restoreBackup(){
  const file=await pickFile(".json,application/json");if(!file)return;let b;
  try{b=JSON.parse(await file.text());if(b.format!=="caixa-forte-backup")throw 0}catch{toast("Este arquivo não é um backup da Caixa Forte.");return}
  openModal({title:"Restaurar backup",body:`<p style="margin:0">Backup de ${esc(new Date(b.exportedAt).toLocaleString("pt-BR"))}. Os dados atuais serão substituídos.</p>${field("Senha ou código de recuperação do backup",`<input class="inp" type="password" name="pw">`)}`,submit:"Restaurar",
   onSubmit:async f=>{const o=await openBackup(b,f.elements.pw.value);if(!o)return"Senha ou código incorreto para este backup.";S.data=ensureSystem(o.data);markDirty();render();toast("Backup restaurado")}});
}
function wipe(){
  openModal({title:"Apagar todos os dados",body:`<p style="margin:0">Isso apaga definitivamente o cofre e todos os lançamentos desta conta. Recomendo exportar um backup antes.</p>${field('Digite APAGAR para confirmar',`<input class="inp" name="c" autocomplete="off">`)}`,submit:"Apagar tudo",
   onSubmit:async f=>{if(f.elements.c.value.trim().toUpperCase()!=="APAGAR")return"Digite APAGAR para confirmar.";
     clearTimeout(S.saveTimer);S.dirty=false;if(S.unsubMeta){S.unsubMeta();S.unsubMeta=null}
     if(S.drv){await drvWipe();S.rev="";S.drvDay=""}else if(S.gas){await gasRun("wipeVault");try{await gasRun("clearRecovery");await gasRun("disableTotp")}catch{}S.totpOn=false;S.rev=""}else if(S.local){try{localStorage.removeItem(LKEY)}catch{}}else{for(const sl of["","a","b"])for(let i=0;i<Math.max(S.chunks,1);i++){try{await chunkRef(i,sl).delete()}catch{}}await metaRef().delete()}
     S.key=null;S.raw=null;S.wraps=null;S.data=null;S.chunks=0;S.slot="";closeModal();renderGate("create");return false},
   onMount:f=>{$(".btn.pri",f).className="btn danger"}});
}

(async function boot(){
  if(!window.crypto||!crypto.subtle){renderGate("nodb","Este navegador não oferece criptografia segura. Use uma versão atual do Chrome, Safari, Edge ou Firefox.");return}
  if(window.google&&google.script&&google.script.run){S.gas=true;document.title="Caixa Forte";
    try{S.ga=await gasCall("hello");renderGate(S.ga.vault||S.ga.auth?"unlock":"create")}catch(e){renderGate("nodb",e.message)}return}
  if(CF_GOOGLE_CLIENT_ID&&!window.claude){S.drv=true;document.title="Caixa Forte";
    try{await loadGIS()}catch(e){renderGate("nodb",e.message);return}
    let hint="";try{hint=localStorage.getItem(DRV_HINT)||""}catch{}S.gUser=hint||null;renderGate(hint?"unlock":"google");return}
  if(!window.claude){S.local=true;let has=false;try{has=!!localStorage.getItem(LKEY)}catch{renderGate("nodb","Este navegador bloqueou o armazenamento local. Saia do modo anônimo ou permita dados do site.");return}
    document.title="Caixa Forte (offline)";renderGate(has?"unlock":"create");return}
  let db=null,user=null;
  try{[db,user]=await Promise.all([window.claude?.use?.("db"),window.claude?.use?.("user")])}catch{}
  const uid=user?await user.id():null;
  if(!db||!uid){renderGate("nodb","Para usar a Caixa Forte, abra esta página logado na sua conta Claude (no site ou no app, no computador ou no celular). Seus dados ficam numa área privada dessa conta.");return}
  S.db=db;S.uid=uid;
  try{const m=await retry(()=>metaRef().get());renderGate(m.exists?"unlock":"create")}
  catch{renderGate("nodb","Não foi possível conectar ao cofre agora. Verifique sua internet e recarregue a página.")}
})();
